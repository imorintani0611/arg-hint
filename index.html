<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>卡關怎麼辦</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>卡關怎麼辦？</h1>
  <p>這裡不會直接給答案，只會幫你找到卡住的地方</p>
</header>

<main>

  <div class="section-block">
    <p class="section-title"><span class="num-badge">一</span>先自己檢查這幾件事</p>
    <div class="checklist">
      <div class="checklist-item"><span class="checklist-num">①</span>查看信箱，看看有沒有未讀郵件、有沒有可以回覆的信</div>
      <div class="checklist-item"><span class="checklist-num">②</span>換幾個不同的關鍵字搜尋看看</div>
      <div class="checklist-item"><span class="checklist-num">③</span>想一想有沒有哪些事件、地點或人名，可能可以在案件查詢系統裡查得到</div>
      <div class="checklist-item"><span class="checklist-num">④</span>回頭看看已經看過的網站，有沒有漏掉的角落或連結</div>
    </div>
  </div>

  <div class="section-block">
    <p class="section-title"><span class="num-badge">二</span>階段性提示</p>

    <p class="diag-intro">
      如果上面四件事都做過還是卡住，請用關鍵字搜尋相關提示。
      關鍵字類型有兩種：<br>
      A. 人名（提供這個人物的相關提示）<br>
      B. 案件代碼（提供這個代碼的相關提示）
    </p>

    <div class="hint-search-row">
      <input type="text" id="hintSearchInput" class="hint-search-input" placeholder="輸入人名或案件代碼" autocomplete="off">
      <button id="hintSearchBtn" class="hint-search-btn" aria-label="搜尋">🔍</button>
    </div>

    <div id="hintResults"></div>
  </div>

  <p class="dm-note">如果看完提示還是完全沒有頭緒，歡迎私訊製作者。</p>

</main>

<script src="js/main.js"></script>
</body>
</html>
